<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link
      rel="preload"
      href="forced_square.woff2"
      as="font"
      type="font/woff2"
      crossorigin="anonymous"
    />
    <link rel="preload" href="images/logo.svg" as="image" type="image/svg+xml" />
    <link rel="preload" href="images/discord.svg" as="image" type="image/svg+xml" />
    <link rel="manifest" href="manifest.json" />
    <meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no" />
    <title>Home | Schoology</title>
    <link rel="icon" type="image/png" href="https://resources.finalsite.net/images/f_auto,q_auto/v1626100427/k12albemarleorg/uj41eppe27bunrvhwnep/PowerSchoolLogos_Vertical-01.png" />
    <script defer="defer" src="main.bundle.js"></script>
    <style>
      #pooopoverlay {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        overflow: hidden;
        background: #000;
      }

      #pooopoverlay img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      #pooopoverlay[hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <canvas id="screen"></canvas>
    <div id="ui"></div>
    <div id="transition-layer"></div>

    <div id="pooopoverlay" role="img" aria-label="pppoooooooop">
      <img src="images/pooop.png" alt="this is totally schoology" />
    </div>
    <script>
      (() => {
        const overlay = document.getElementById("pooopoverlay");
        window.addEventListener("keydown", (event) => {
          if (event.code !== "Space" || event.repeat) return;
          event.preventDefault();
          overlay.hidden = !overlay.hidden;
        });
      })();
    </script>
  </body>
</html>
